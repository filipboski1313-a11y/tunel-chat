name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/tunel-chat-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/tunel-chat-windows-amd64.exe .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/tunel-chat-macos-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/tunel-chat-macos-amd64 .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
